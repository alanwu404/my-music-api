<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>我的 MiniMax 音乐生成器</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; line-height: 1.6; background: #f4f7f6; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        textarea, input { width: 100%; margin-bottom: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #ff4757; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #ff6b81; }
        #result { margin-top: 20px; text-align: center; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎵 MiniMax 音乐生成</h2>
        <label>歌词：</label>
        <textarea id="lyrics" rows="4" placeholder="无歌词..."></textarea>
        <label>风格描述：</label>
        <input type="text" id="prompt" placeholder="例如：独立民谣，忧郁，内省">
        <button onclick="generateMusic()" id="btn">开始创作</button>
        <div id="result"></div>
    </div>

    <script>
        async function generateMusic() {
            const btn = document.getElementById('btn');
            const resultDiv = document.getElementById('result');
            const apiKey = "sk-cp-4GctYnXmTCB5EXE351VR4ds--vWj5SZHA_CtT3gND86d9hOkhRSAoo7qBtp3Jn5wQ3piRJDIPdbhPOD2Zg94jBf-v97-vM1e2ubZj-P1i7VUgaZZAOB9IZ8"; // 稍后
            
            btn.disabled = true;
            resultDiv.innerHTML = '<p class="loading">正在谱曲中，请稍候...</p>';

            try {
                const response = await fetch('https://api.minimaxi.com/v1/music_generation', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "music-2.6",
                        prompt: document.getElementById('prompt').value,
                        lyrics: document.getElementById('lyrics').value,
                        audio_setting: { sample_rate: 44100, bitrate: 256000, format: "wav" },
                        stream: false
                    })
                });

                const data = await response.json();
                // 注意：这里需要根据 API 返回的 hex 或 url 进行处理
                if (data.data && data.data.audio) {
                    resultDiv.innerHTML = `<p>✅ 生成成功！</p><audio controls src="data:audio/wav;base64,${data.data.audio}"></audio>`;
                } else {
                    resultDiv.innerHTML = `<p style="color:red">失败了：${data.base_resp.status_msg || '未知错误'}</p>`;
                }
            } catch (e) {
                resultDiv.innerHTML = `<p style="color:red">请求出错：${e.message}</p>`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
